# Project information
site_name: SJTU-SRC Wiki
site_url: https://sjtu-src.github.io/Wiki/
site_author: SYLG
site_description: Robocup Small Size League 教培系统
docs_dir: build
exclude_docs: |
  chapter_software/outline.md
  chapter_software/archive/
# Repository
repo_name: sjtu-src/Wiki
repo_url: https://github.com/sjtu-src/Wiki
# Copyright
copyright: Copyright &copy; 2023 SYLG   2024 sasuke-yang

# Configuration
theme:
  name: material
  custom_dir: build/overrides
  language: zh
  features:
    # - announce.dismiss
    - content.action.edit
    - header.autohide
    # - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - content.footnote.tooltips
    # - header.autohide
    # - navigation.expand
    - navigation.indexes
    # - navigation.instant
    # - navigation.prune
    - navigation.sections
    # - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  icon:
    logo: logo
    repo: fontawesome/brands/github
    edit: material/file-edit-outline
    annotation: material/chevron-right-circle
      # note: octicons/tag-16
      # abstract: octicons/checklist-16
      # info: octicons/info-16
      # tip: octicons/squirrel-16
      # success: octicons/check-16
      # question: octicons/question-16
      # warning: octicons/alert-16
      # failure: material/license
      # danger: octicons/zap-16
      # bug: octicons/bug-16
      # example: octicons/beaker-16
      # quote: octicons/quote-16
      # champion: fontawesome/solid/champagne-glasses
    # - toc.integrate
  palette:
    - scheme: default
      primary: custom
      # accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: grey
      # accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Noto Sans SC
    code: Fira Code
  favicon: assets/images/favicon.svg
  logo: assets/images/logo.jpg


extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SY-LG
  generator: false
  background:
    homepage: 'assets/background-image.jpg'  # 首页背景图片
    not_homepage: 'assets/not-background-image.jpg'  # 非首页背景图片

# Plugins
plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: none
      width: 100%
      height: auto
      zoomable: true
      draggable: false
      auto_caption: false
      caption_position: bottom
# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html  
  - pymdownx.critic
  - pymdownx.tilde  
  - pymdownx.caret
  - pymdownx.details

  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.keys  
  - pymdownx.mark
  - pymdownx.smartsymbols  
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true

  # - pymdownx.magiclink:
  #     repo_url_shorthand: true
  #     user: squidfunk
  #     repo: mkdocs-material

  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true


extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/extra.css
